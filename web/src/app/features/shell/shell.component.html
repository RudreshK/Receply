<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed()">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="logo-mark.svg" alt="" width="28" height="28">
        <div class="brand-text">
          <span class="brand-name">Receply</span>
          <span class="brand-tag">AI Receptionist</span>
        </div>
      </div>
      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Hide menu" title="Hide menu">
        ‹
      </button>
    </div>
    <nav>
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>
    <div class="user-info">
      @if (auth.currentUser(); as user) {
        <div class="name">{{ user.fullName }}</div>
        <div class="role">{{ user.role }}</div>
      }
      <button type="button" class="theme-toggle" (click)="theme.toggle()">
        {{ theme.theme() === 'dark' ? '☀ Light mode' : '🌙 Dark mode' }}
      </button>
      <button type="button" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <button type="button" class="sidebar-reopen" (click)="toggleSidebar()" aria-label="Show menu" title="Show menu">
    ›
  </button>

  <main class="content" [class.content--full-bleed]="fullBleed()">
    <router-outlet></router-outlet>
  </main>
</div>
