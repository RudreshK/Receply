name: receply
metadata:
  template: receply@0.1.0

services:
  api:
    project: ./src/Receply.Api
    host: appservice
    language: docker
    docker:
      path: Dockerfile
      context: ../..

  workers:
    project: ./src/Receply.Workers
    host: appservice
    language: docker
    docker:
      path: Dockerfile
      context: ../..
